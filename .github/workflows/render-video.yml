name: Render Remotion videos (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run typecheck
      - run: npx remotion render src/index.tsx OverviewEN out/overview.en.mp4 --concurrency=2
      - run: npx remotion render src/index.tsx OverviewKO out/overview.ko.mp4 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-overviews
          path: video/out/*.mp4
