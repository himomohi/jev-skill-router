name: Tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Install.py', 'examples/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Install.py', 'examples/**', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/benchmark_context.py
      - run: python scripts/evaluate_live.py --preflight
