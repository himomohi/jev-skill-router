name: Tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Install.py', 'examples/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Install.py', 'examples/**', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/benchmark_context.py
